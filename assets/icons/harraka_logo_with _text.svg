<svg viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: 'Poppins', 'Inter', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Mark: a speed/motion glyph built from an "H" negative space and a forward-motion cut -->
  <g transform="translate(0,20)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#E8442A"/>
    <!-- abstract H formed by two bars + a diagonal speed cut, rendered in negative space -->
    <path d="
      M32 28
      L32 92
      L50 92
      L50 68
      L74 68
      L74 92
      L92 92
      L92 28
      L74 28
      L74 50
      L50 50
      L50 28
      Z"
      fill="#FFFFFF"/>
    <!-- motion accent: a small forward chevron cut into the top-right, signaling speed -->
    <path d="M92 28 L108 28 L92 44 Z" fill="#B8301A"/>
  </g>

  <!-- Wordmark -->
  <text x="146" y="102" class="word" font-size="58" font-weight="600" letter-spacing="0.5" fill="#1A1A1A">harraka</text>
</svg>
